# References:
# https://github.com/thomasread99/expo-workflows/

name: Build App

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: 1
  CI: 1

on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        description: "Ref to Build"
        required: true
      submit:
        type: boolean
        description: "Submit?"
        required: false
      release:
        type: boolean
        description: "Release?"
        required: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      build_success: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.USTHING_GITHUB_TOKEN }}
          ref: ${{ inputs.ref }}
          repository: USThing/USThingApp

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
            ~/.cache/node/corepack/v1
            ~/Library/Caches/node/corepack/v1
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "zulu"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          add-job-summary: 'never'

      - name: Accept Android SDK Licenses
        # android-actions/setup-android@v4 broke on runners with preinstalled
        # cmdline-tools 20.0: after accepting licenses it installs the legacy
        # "tools" package, which Google removed (sdkmanager exits 1). The
        # ubuntu-latest image already ships the full SDK; only acceptance is
        # needed for EAS local builds.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest

      - name: Install Dependencies
        run: yarn --immutable && npm install -g --allow-scripts=@posthog/cli @posthog/cli

      # Build the AAB and APK in one Gradle run so they share compilation, R8,
      # and NDK work. EAS resolves `gradleCommand` from eas.json at CLI time, so
      # we inject it here instead of requiring a change in the app repository.
      - name: Configure combined Android build
        run: |
          jq '.build.production.android = ((.build.production.android // {}) + {gradleCommand: ":app:bundleRelease :app:assembleRelease"})' eas.json > eas.json.tmp
          mv eas.json.tmp eas.json
          jq -e '.build.production.android.gradleCommand' eas.json

      # The patched `production` profile runs `:app:bundleRelease
      # :app:assembleRelease` in a single Gradle invocation. EAS packs both
      # outputs into one tar.gz (its artifact glob matches more than one file),
      # which we unpack below.
      - name: Build AAB and APK
        id: build
        run: eas build --profile production --platform android --local --non-interactive --output=${{ github.workspace }}/android-build.tar.gz
        env:
          IS_SUBMIT_BUILD: ${{ inputs.submit }}
          IS_RELEASE_BUILD: ${{ inputs.release }}
          POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          POSTHOG_CLI_HOST: https://us.posthog.com
          GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true

      - name: Unpack AAB and APK
        if: ${{ always() && hashFiles('android-build.tar.gz') != '' }}
        run: |
          mkdir -p out
          tar -xzf android-build.tar.gz -C out
          cp out/bundle/release/*.aab "${{ github.workspace }}/usthing.aab"
          cp out/apk/release/*.apk "${{ github.workspace }}/usthing.apk"

      - name: Upload AAB Artifact
        if: ${{ always() && hashFiles('usthing.aab') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: usthing.aab
          path: ${{ github.workspace }}/usthing.aab
          retention-days: 7
          compression-level: 6

      - name: Upload APK Artifact
        if: ${{ always() && hashFiles('usthing.apk') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: usthing.apk
          path: ${{ github.workspace }}/usthing.apk
          retention-days: 7
          compression-level: 6

      # https://docs.expo.dev/submit/ios/#submitting-your-app-using-ci
      - name: Submit to Google Play
        if: ${{ inputs.submit == true }}
        continue-on-error: ${{ inputs.release == false }}
        run: eas submit --profile production --platform android --non-interactive --path ${{ github.workspace }}/usthing.aab

      - name: Submit to Production Server
        if: ${{ inputs.release == true }}
        run: |
          curl --fail-with-body --show-error --silent \
          --connect-timeout 30 \
          --max-time 300 \
          --retry 3 \
          --retry-delay 10 \
          --retry-connrefused \
          -X POST \
          'https://static.api.usthing.xyz/v1/apk/latest' \
          -H 'Authorization: Bearer ${{ secrets.ANDROID_APK_RELEASE_KEY }}' \
          -F 'apkFile=@${{ github.workspace }}/usthing.apk' \
          -F "apkVersion=$(jq -r '.expo.version' app.json)"

  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    outputs:
      build_success: ${{ steps.build.outcome == 'success' }}
    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.USTHING_GITHUB_TOKEN }}
          ref: ${{ inputs.ref }}
          repository: USThing/USThingApp

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup Corepack
        run: corepack enable

      - name: Cache Yarn
        uses: actions/cache@v6
        with:
          path: |
            .yarn/cache
            ~/.yarn/berry/cache
            ~/.cache/node/corepack/v1
            ~/Library/Caches/node/corepack/v1
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: pods-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', 'app.json', 'eas.json') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Cache ccache (iOS)
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ccache
            ~/.ccache
            ~/.cache/ccache
          key: ccache-ios-${{ runner.os }}-${{ hashFiles('yarn.lock', 'app.json', 'package.json', 'eas.json') }}
          restore-keys: |
            ccache-ios-${{ runner.os }}-

      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest

      - name: Install Dependencies
        run: yarn --immutable && npm install -g --allow-scripts=@posthog/cli @posthog/cli

      - name: Build iOS App
        id: build
        run: eas build --profile production --platform ios --local --non-interactive --output ${{ github.workspace }}/usthing.ipa
        env:
          IS_SUBMIT_BUILD: ${{ inputs.submit }}
          IS_RELEASE_BUILD: ${{ inputs.release }}
          CCACHE_MAXSIZE: 500M

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: usthing.ipa
          path: ${{ github.workspace }}/usthing.ipa
          retention-days: 7
          compression-level: 6

      # https://docs.expo.dev/submit/ios/#submitting-your-app-using-ci
      - name: Submit to TestFlight
        if: ${{ inputs.submit == true }}
        continue-on-error: ${{ inputs.release == false }}
        run: eas submit --profile production --platform ios --non-interactive --path ${{ github.workspace }}/usthing.ipa

  report-status-create:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}

    steps:
      - name: Setup repo
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.USTHING_GITHUB_TOKEN }}
          ref: ${{ inputs.ref }}
          repository: USThing/USThingApp

      - name: Resolve SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report pending status
        run: |
          gh api --method POST "repos/USThing/USThingApp/statuses/${{ steps.resolve.outputs.sha }}" \
            -f state=pending \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Build in progress...' \
            -f context='USThing App Builder' \
            --silent
        env:
          GH_TOKEN: ${{ secrets.USTHING_GITHUB_TOKEN }}

  report-status:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    needs:
      - report-status-create
      - build-android
      - build-ios

    # Run this job even if previous jobs fail.
    if: ${{ always() }}

    steps:
      - name: Report final status
        run: |
          if [[ -z "$SHA" ]]; then
            echo "::error::resolved SHA is empty (report-status-create failed?), cannot post status."
            exit 1
          fi
          if [[ "$BUILD_ANDROID" == true && "$BUILD_IOS" == true ]]; then
            state=success
            description='Build succeeded!'
          else
            state=failure
            description='Build failed on one or more platforms. Please check the logs for details.'
          fi

          gh api --method POST "repos/USThing/USThingApp/statuses/$SHA" \
            -f state="$state" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="$description" \
            -f context='USThing App Builder' \
            --silent
        env:
          GH_TOKEN: ${{ secrets.USTHING_GITHUB_TOKEN }}
          SHA: ${{ needs.report-status-create.outputs.sha }}
          BUILD_ANDROID: ${{ needs.build-android.outputs.build_success }}
          BUILD_IOS: ${{ needs.build-ios.outputs.build_success }}
